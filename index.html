    <script>
      // Suppress benign WebSocket connection errors in Cloud Run container environments
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (e.reason.message === 'WebSocket closed without opened.' ||
            (typeof e.reason.message === 'string' && e.reason.message.includes('WebSocket')))
        ) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.includes('WebSocket') || e.message.includes('@vite/client'))
        ) {
          e.preventDefault();
        }
      });
    </script>
